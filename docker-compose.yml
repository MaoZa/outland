services:
  # ============================================
  # Backend API Service
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: outland-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - OUTLAND_DB_URL=${OUTLAND_DB_URL:-sqlite+aiosqlite:///./data/outland.db}
      - OUTLAND_JWT_SECRET=${OUTLAND_JWT_SECRET:-change-me-in-production}
      - OUTLAND_CORS_ORIGINS=${OUTLAND_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - OUTLAND_DEBUG=${OUTLAND_DEBUG:-false}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend-data:/app/data
    restart: unless-stopped

  # ============================================
  # Frontend Web Service
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: outland-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped

# Network Configuration
networks:
  default:
    name: outland-network
