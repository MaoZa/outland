name: AI Code Reviewer (DeepSeek-V4-Flash)

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ai-code-review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract PR Diff
        id: get_diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIFF=$(gh pr diff ${{ github.event.pull_request.number }})
          TRUNCATED_DIFF="${DIFF:0:12000}"
          
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "diff<<$EOF" >> $GITHUB_OUTPUT
          echo "$TRUNCATED_DIFF" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Code Review & Comment
        uses: actions/github-script@v7
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'gpt-4o' }}
          PR_DIFF: ${{ steps.get_diff.outputs.diff }}
        with:
          script: |
            const apiKey = process.env.OPENAI_API_KEY;
            const baseUrl = process.env.OPENAI_BASE_URL;
            const modelName = process.env.AI_MODEL;
            const diff = process.env.PR_DIFF;
            
            if (!apiKey) {
              core.setFailed('OPENAI_API_KEY secret is not set.');
              return;
            }

            const systemPrompt = `You are an expert Senior Staff Software Engineer performing a code review.
            You will be provided with a standard unified Git diff.
            
            Focus STRICTLY on:
            1. 🐛 Logic errors, edge cases, or potential bugs.
            2. 🔒 Security vulnerabilities.
            3. ⚡ Performance bottlenecks.
            4. 🏗️ Architecture and best practices.
            
            Format your output using clear Markdown headers and bullet points. DO NOT comment on minor stylistic or formatting issues.`;

            const userPrompt = `Please review the following git diff:\n\`\`\`diff\n${diff}\n\`\`\``;

            console.log(`Sending request to ${baseUrl}/chat/completions using model ${modelName}...`);

            const response = await fetch(`${baseUrl}/chat/completions`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${apiKey}`
              },
              body: JSON.stringify({
                model: modelName,
                messages: [
                  { role: 'system', content: systemPrompt },
                  { role: 'user', content: userPrompt }
                ],
                max_tokens: 2048,
                temperature: 0.2
              })
            });

            if (!response.ok) {
              const errorText = await response.text();
              core.setFailed(`API Request failed with status ${response.status}: ${errorText}`);
              return;
            }

            const data = await response.json();
            const aiResponse = data.choices[0].message.content;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🤖 **AI Code Review (${modelName})**\n\n${aiResponse}`
            });
