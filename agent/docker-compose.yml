# Outland Agent Service
services:
  # ============================================
  # Outland Agent Service (includes ADB Server)
  # ============================================
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: outland-agent
    # Use host network mode to ensure UDP media streams work properly
    # This allows aiortc to correctly get local IP and srflx candidates
    network_mode: host
    environment:
      # ADB Server runs inside this container
      - ADB_SERVER_HOST=${ADB_SERVER_HOST:-127.0.0.1}
      - ADB_SERVER_PORT=${ADB_SERVER_PORT:-5037}
      # Redroid container name (Agent dynamically creates containers via Docker Socket)
      - REDROID_HOST=${REDROID_HOST:-127.0.0.1}
      - REDROID_ADB_PORT=${REDROID_ADB_PORT:-5555}
      - SDL_VIDEODRIVER=dummy
      - SCRCPY_SERVER_PATH=/usr/local/bin/scrcpy-server
      - BACKEND_URL=${BACKEND_URL:-http://localhost:8000}
      - AGENT_ADVERTISED_URL=${AGENT_ADVERTISED_URL:-http://localhost:9090}
    volumes:
      # Mount Docker Socket to manage containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Persist ADB key pair so paired devices remain trusted after restart
      - ./agent-adb-keys:/root/.android
    restart: unless-stopped

volumes:
  agent-adb-keys:
